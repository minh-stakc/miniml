name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ["5.1.x", "5.2.x"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build @all

      # `dune test` runs the alcotest/qcheck suites and the cram golden
      # snapshots. Cram diffs fail the build (CI never auto-promotes), so the
      # CLI's output stays pinned.
      - name: Test (unit, differential, property, cram snapshots)
        run: opam exec -- dune test

      - name: Check formatting
        if: matrix.ocaml-compiler == '5.2.x'
        run: |
          opam install -y ocamlformat.0.29.0
          opam exec -- dune build @fmt
